[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grawji"
version = "0.6.0"
description = "GTK4 frontend for rawji - interactive Fuji RAF conversion via the camera engine."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Patrick Zwerschke" }]
dependencies = [
  "PyGObject",
  "numpy",
  "pyusb",
  # rawji is not on PyPI and does not bump versions
  "rawji @ git+https://github.com/pinpox/rawji@3b68b9c7ba23f2bef1cd9203652035a980eca1f7",
]

[project.optional-dependencies]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-cov",
  "pytest-github-actions-annotate-failures",
  "pytest-xvfb",
  "pre-commit",
  "pygobject-stubs",
]

[project.scripts]
grawji = "grawji.__main__:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/grawji"]
exclude = ["**/*.cmb", "**/*.cmb.bak"]

[tool.ruff]
line-length = 79
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["ui"]

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []

select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "A",   # flake8-builtins
  "B",   # flake8-bugbear
  "S",   # flake8-bandit
  "C4",  # flake8-comprehensions
  "Q",   # flake8-quotes
  "RET", # flake8-return
  "SIM", # flake8-simplify
  "PTH", # flake8-use-pathlib
  "UP",  # pyupgrade
  "D",   # pydocstyle
  "I",   # isort
  "N",   # pep8-naming
  "W",   # warning
  "PL",  # Pylint
  "T",   # flake8-debugger + flake8-print
  "ARG", # flake8-unused-arguments
  "DTZ", # flake8-datetimez
  "G",   # flake8-logging-format
  "ICN", # flake8-import-conventions
  "ISC", # implicit string concatenation
  "LOG", # flake8-logging
  "PIE", # flake8-pie
  "RSE", # flake8-raise
  "TID", # flake8-tidy-imports
  "FURB",# refurb
  "NPY", # numpy rules
  "PGH", # pygrep-hooks
  "FLY", # flynt
  "PERF",# Perflint
  "RUF", # Ruff-specific rules
]

ignore = [
  "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]
"src/grawji/__main__.py" = ["T201"]
"scripts/**" = ["D103", "T201", "E402"]
"src/grawji/controllers/*.py" = ["E402"]
"src/grawji/imaging/*.py" = ["E402"]
"src/grawji/views/*.py" = ["E402"]
"tests/**" = ["PLR2004", "S", "ARG", "ANN", "E402", "E501", "F401", "PLC0415"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-branches = 14
max-args = 6

[tool.ruff.lint.isort]
known-first-party = ["grawji", "tests"]

[tool.mypy]
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_decorated = false
disallow_any_explicit = false
disallow_untyped_defs = true
check_untyped_defs = true
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["rawji.*", "usb.*", "cairo", "lensfunpy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["gi", "gi.*"]
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = [
  "grawji.controllers.*",
  "grawji.imaging.*",
  "grawji.views.*",
  "grawji.__main__",
]
disallow_subclassing_any = false
warn_return_any = false
disable_error_code = ["untyped-decorator", "misc"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
check_untyped_defs = true
warn_return_any = false
disable_error_code = [
  "arg-type",
  "attr-defined",
  "assignment",
  "union-attr",
  "var-annotated",
  "no-untyped-def",
]

[tool.coverage.run]
source = ["grawji"]
branch = true
omit = [
  "**/__init__.py",
  "**/__main__.py",
  "src/grawji/views/**",
  "src/grawji/ui/**",
  "src/grawji/logsetup.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == \"__main__\":",
  "\\.\\.\\.",
]
