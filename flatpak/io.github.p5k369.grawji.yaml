# Flatpak manifest for grawji.
#
# Build and install locally:
#   flatpak-builder --user --install --force-clean build flatpak/io.github.p5k369.grawji.yaml
# Run:
#   flatpak run io.github.p5k369.grawji

id: io.github.p5k369.grawji
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: grawji

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # The camera talks PTP over raw USB (usb), the UI wants the GPU (dri).
  - --device=dri
  - --device=usb
  # Read and write files anywhere (cards under /run/media, external
  # drives, ...). Write access is needed for the per-image sidecars
  # that grawji stores next to each RAF, and for exports written outside the file-chooser portal.
  - --filesystem=host

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/man
  - /bin/exiv2
  - '*.a'
  - '*.la'

modules:
  - name: libusb
    sources:
      - type: archive
        url: https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.tar.bz2
        sha256: fea36f34f9156400209595e300840767ab1a385ede1dc7ee893015aea9c6dbaf

  - name: python3-pyusb
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --prefix=${FLATPAK_DEST} pyusb-1.3.1-py3-none-any.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/28/b8/27e6312e86408a44fe16bd28ee12dd98608b39f7e7e57884a24e8f29b573/pyusb-1.3.1-py3-none-any.whl
        sha256: bf9b754557af4717fe80c2b07cc2b923a9151f5c08d17bdb5345dac09d6a0430

  - name: python3-numpy-build-deps
    buildsystem: simple
    cleanup:
      - '*'
    build-commands:
      - pip3 install --no-deps --ignore-installed --prefix=${FLATPAK_DEST}
        *.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/bc/b8/fc595c60a7b6f5f08b4f6ad65e60688e8c61f76064ebe847eaf85d0c59fa/cython-3.3.0-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl
        sha256: 23942b0662642927a55676e4b26e6840fb166dd7d76436384685227e7e8619a4
      - type: file
        url: https://files.pythonhosted.org/packages/37/35/26a6c96ed91fa3baacd64da82f279bc282eade45003c00d99293332b45e1/meson_python-0.22.0-py3-none-any.whl
        sha256: 0ce9fa40bb8bfaecccba97347063970e1a18cca2730d6e68a341dc0b73b284a4
      - type: file
        url: https://files.pythonhosted.org/packages/b9/8e/d883718e872abc214ba053f60f7e6edc2abd5ffbd1544beb01a9c92ddd3c/pyproject_metadata-0.12.1-py3-none-any.whl
        sha256: f7162d580a96386a8eb096da06215f981f547d1490f03055ef99e323bc2da427
      - type: file
        url: https://files.pythonhosted.org/packages/df/b2/87e62e8c3e2f4b32e5fe99e0b86d576da1312593b39f47d8ceef365e95ed/packaging-26.2-py3-none-any.whl
        sha256: 5fc45236b9446107ff2415ce77c807cee2862cb6fac22b8a73826d0693b0980e

  - name: python3-numpy
    buildsystem: simple
    build-options:
      env:
        PYTHONPATH: /app/lib/python3.13/site-packages
    build-commands:
      - pip3 install --no-deps --no-build-isolation
        -Csetup-args=-Dblas=none -Csetup-args=-Dlapack=none
        --prefix=${FLATPAK_DEST} numpy-2.5.3.tar.gz
    cleanup:
      - /lib/python3.13/site-packages/numpy/_core/tests
      - /lib/python3.13/site-packages/numpy/tests
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/13/01/11703282db468b85f6f7b8c7f22d058de5970d5c7e60a3a8aaa313c3de36/numpy-2.5.3.tar.gz
        sha256: df2d5874ff183595a4ba404edd04f6bd9b5505c1d7708573f6a6c17489a67563

  - name: exiv2
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DEXIV2_ENABLE_NLS=OFF
      - -DEXIV2_BUILD_SAMPLES=OFF
      - -DEXIV2_BUILD_UNIT_TESTS=OFF
      - -DEXIV2_ENABLE_BMFF=OFF
    sources:
      - type: archive
        url: https://github.com/Exiv2/exiv2/releases/download/v0.27.7/exiv2-0.27.7-Source.tar.gz
        sha256: 70629dc27e3d4dd5c3fa91afbea93166d338b1de284e6a4c44bbf9dcfe7bbc6d

  - name: gexiv2
    buildsystem: meson
    config-opts:
      - -Dpython3=false
      - -Dvapi=false
      - -Dtools=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gexiv2/0.14/gexiv2-0.14.3.tar.xz
        sha256: 21e64d2c56e9b333d44fef3f2a4b25653d922c419acd972fa96fab695217e2c8

  - name: python3-lsdetect
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --prefix=${FLATPAK_DEST} lsdetect-*.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/10/2e/8010e9bed4720b84554a2c105aea4839ef7752e382cb69da76ef7cfcb72b/lsdetect-0.2.0-cp311-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
        sha256: c07a37eaef449d31a9f512950d3e78ee4e69a2aadbc072de4864cc575bffb789

  - name: python3-rawji
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --no-build-isolation
        --prefix=${FLATPAK_DEST} .
    sources:
      - type: git
        url: https://github.com/pinpox/rawji.git
        commit: 02cb559bb1555b3f77e4b246cad06c44cff56c8e

  - name: python3-hatchling
    buildsystem: simple
    cleanup:
      - '*'
    build-commands:
      - pip3 install --no-deps --ignore-installed --prefix=${FLATPAK_DEST}
        *.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/56/49/2797ec0ef88008a653a8867bb8d1e5c223cd2df8e40390dd5c6a0279cbc5/hatchling-1.30.1-py3-none-any.whl
        sha256: 161eacafb3c6f91526e92116d21426369f2c36e98c36a864f11a96345ad4ee31
      - type: file
        url: https://files.pythonhosted.org/packages/df/b2/87e62e8c3e2f4b32e5fe99e0b86d576da1312593b39f47d8ceef365e95ed/packaging-26.2-py3-none-any.whl
        sha256: 5fc45236b9446107ff2415ce77c807cee2862cb6fac22b8a73826d0693b0980e
      - type: file
        url: https://files.pythonhosted.org/packages/f1/d9/7fb5aa316bc299258e68c73ba3bddbc499654a07f151cba08f6153988714/pathspec-1.1.1-py3-none-any.whl
        sha256: a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189
      - type: file
        url: https://files.pythonhosted.org/packages/54/20/4d324d65cc6d9205fabedc306948156824eb9f0ee1633355a8f7ec5c66bf/pluggy-1.6.0-py3-none-any.whl
        sha256: e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746
      - type: file
        url: https://files.pythonhosted.org/packages/7c/a4/81502f486f01db95bc8320646a8a12511f5e556cb63d5e224d91816605c4/trove_classifiers-2026.6.1.19-py3-none-any.whl
        sha256: ab4c4ec93cc4a4e7815fa759906e05e6bb3f2fbd92ea0f897288c6a43efd15b3

  - name: libjxl-tools
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=OFF
      - -DBUILD_TESTING=OFF
      - -DJPEGXL_ENABLE_TOOLS=ON
      - -DJPEGXL_ENABLE_BENCHMARK=OFF
      - -DJPEGXL_ENABLE_DEVTOOLS=OFF
      - -DJPEGXL_ENABLE_DOXYGEN=OFF
      - -DJPEGXL_ENABLE_EXAMPLES=OFF
      - -DJPEGXL_ENABLE_JNI=OFF
      - -DJPEGXL_ENABLE_MANPAGES=OFF
      - -DJPEGXL_ENABLE_OPENEXR=OFF
      - -DJPEGXL_ENABLE_PLUGINS=OFF
      - -DJPEGXL_ENABLE_SJPEG=OFF
      - -DJPEGXL_ENABLE_SKCMS=OFF
      - -DJPEGXL_ENABLE_VIEWERS=OFF
      - -DJPEGXL_FORCE_SYSTEM_BROTLI=ON
      - -DJPEGXL_FORCE_SYSTEM_HWY=ON
      - -DJPEGXL_FORCE_SYSTEM_LCMS2=ON
    cleanup:
      - /include
      - /lib
      - /share
      - /bin/djxl
      - /bin/jxlinfo
      - /bin/jxltran
    sources:
      - type: archive
        url: https://github.com/libjxl/libjxl/archive/refs/tags/v0.12.0.tar.gz
        sha256: 03e9be69a30be4011f559da75328b6d7cea8ad921fabfbd551ce10bf45cdc992

  - name: grawji
    buildsystem: simple
    build-options:
      env:
        PYTHONPATH: /app/lib/python3.13/site-packages
    build-commands:
      - pip3 install --no-deps --no-build-isolation
        --prefix=${FLATPAK_DEST} .
      - install -Dm644 data/io.github.p5k369.grawji.desktop
        ${FLATPAK_DEST}/share/applications/io.github.p5k369.grawji.desktop
      - install -Dm644 data/io.github.p5k369.grawji.metainfo.xml
        ${FLATPAK_DEST}/share/metainfo/io.github.p5k369.grawji.metainfo.xml
      - install -Dm644 data/io.github.p5k369.grawji.svg
        ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.p5k369.grawji.svg
    sources:
      - type: dir
        path: ..
