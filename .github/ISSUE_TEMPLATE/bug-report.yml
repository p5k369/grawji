name: Bug report
description: Something broke or behaves wrongly.
labels: ["bug"]
body:
  - type: input
    id: model
    attributes:
      label: Camera body
      placeholder: FUJIFILM X-T5 (or "no camera involved")
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is grawji installed?
      options:
        - Flatpak
        - Nix
        - Gentoo
        - From source
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: >
        Steps to reproduce and `--verbose` log output are welcome here.
    validations:
      required: true
