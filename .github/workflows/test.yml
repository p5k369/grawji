name: Tests
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, unlabeled]
    branches:
      - main
  push:
    branches:
      - main

jobs:
  tests:
    name: Run Python Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: False
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:

    - uses: actions/checkout@v7

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install the GTK stack and Xvfb
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gexiv2-0.10 \
          libgtk-4-1 libadwaita-1-0 libusb-1.0-0 xvfb \
          libgirepository-2.0-dev libcairo2-dev pkg-config

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "rawji @ git+https://github.com/pinpox/rawji@5549fdb93028549c2bab8abe963f1a91c50b5368"
        pip install -e ".[dev]"

    - name: Test with pytest
      run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

    - name: Upload coverage to Codecov
      # Coverage is identical across the matrix, upload one report.
      if: matrix.python-version == '3.14'
      uses: codecov/codecov-action@v7
      with:
        fail_ci_if_error: true
        use_oidc: true
        slug: p5k369/grawji
