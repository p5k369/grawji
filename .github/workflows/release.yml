name: Release

on:
  workflow_call:
    inputs:
      tag_name:
        description: Tag name of the draft release to build and publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag name of the draft release to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Refuse to release unless the tag, pyproject and the AppStream metainfo all
  # agree on the version, so they can never drift apart in a published build.
  version-guard:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.draft.outputs.sha }}
    steps:
      - name: Look up the draft's target commit
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag_name }}
        # A draft release has no tag ref yet
        run: |
          sha=$(gh api "repos/$GH_REPO/releases" --jq \
            ".[] | select(.tag_name == \"$TAG\") | .target_commitish")
          if [ -z "$sha" ]; then
            echo "no release with tag $TAG found" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.draft.outputs.sha }}
      - name: Tag matches pyproject and metainfo
        run: python scripts/check_version.py --tag "${{ inputs.tag_name }}"

  flatpak:
    needs: version-guard
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version-guard.outputs.sha }}
      - name: Build the Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: grawji.flatpak
          manifest-path: flatpak/io.github.p5k369.grawji.yaml
      - name: Smoke-test the bundle in its sandbox
        run: |
          flatpak install -y --user grawji.flatpak
          flatpak run --env=GLYCIN_SANDBOX_DISABLED=1 \
            --command=python3 io.github.p5k369.grawji \
            "$PWD/scripts/flatpak_smoke.py"
      - name: Build the release notes from the metainfo
        run: python3 scripts/release_notes.py
          --tag "${{ inputs.tag_name }}" > release_body.md
      - name: Hand the bundle and notes to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            grawji.flatpak
            release_body.md
          if-no-files-found: error

  # Runs outside the flatpak container so the gh CLI is available.
  publish:
    needs: [version-guard, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
      - name: Attach the bundle to the draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag_name }}
          SHA: ${{ needs.version-guard.outputs.sha }}
        run: |
          gh release upload "$TAG" grawji.flatpak --clobber
          gh api "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$SHA" \
            --jq .body > generated.md
          printf '\n\n' | cat release_body.md - generated.md > notes.md
          gh release edit "$TAG" --notes-file notes.md
          gh release edit "$TAG" --draft=false
